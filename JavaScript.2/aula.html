<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 1</title>
    <link rel="stylesheet" href="aula.css">
</head>
<body>

    <header>
        <h1>Calculadora de Produtos</h1>
    </header>

    <section>
        <p>Nome do Produto:
            <input type="text" name="product" id="product">
        </p>
        <p>Preço do produto:
            <input type="number" name="bought_product" id="bought_product" min="0">
        </p>
        <p>Peso do produto (kg/uni):
            <input type="number" name="weight_product" id="weight_product" min="0">
        </p>
        <p>Peso usado (kg/uni):
            <input type="number" name="weight_used" id="weight_used" min="0">
        </p>
        <p>
            <input type="button" value="Verificar" onclick="verificar">
        </p>
    </section>

    <footer>
        <p>@Wesley</p>
    </footer>
    <script src="aula.js"></script>
</body>
</html>
